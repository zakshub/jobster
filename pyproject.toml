[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobster"
version = "0.1.0"
description = "Personal first Career Agent with an evidence grounded CareerBrain"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "playwright>=1.47",
  "fastapi>=0.116",
  "uvicorn>=0.35",
  "tzdata>=2025.2; platform_system == 'Windows'"
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
jobster = "jobster.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobster = ["webui/*.html", "webui/*.css", "webui/*.js"]
