    sensitivity: normal
    allow_automatic_use: true

  - key: work_authorization
    value: ""
    aliases:
      - are you authorized to work
      - right to work
    verified: false
    sensitivity: restricted
    allow_automatic_use: false

  - key: visa_sponsorship
    value: ""
    aliases:
      - sponsorship
      - visa sponsorship
    verified: false
    sensitivity: restricted
    allow_automatic_use: false
