answers:
  - key: full_name
    value: Example Candidate
    aliases:
      - name
      - legal name
    verified: true
    sensitivity: normal
    allow_automatic_use: true

  - key: email
    value: candidate@example.com
    aliases:
      - email address
    verified: true
    sensitivity: normal
    allow_automatic_use: true

  - key: portfolio_url
    value: https://example.com
    aliases:
      - portfolio
      - website
      - portfolio website
